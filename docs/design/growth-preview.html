<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Growth — stage mock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --near-black: #0a0a0c;
      --gunmetal: #2a2e35;
      --gunmetal-deep: #1c2026;
      --silver: #cfd5de;
      --silver-bright: #eef1f5;
      --muted: #9aa1ab;
      --champagne: #c4a574;
      --line: rgba(207, 213, 222, 0.28);
      --line-soft: rgba(207, 213, 222, 0.14);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      background: linear-gradient(180deg, #0f1216 0%, var(--near-black) 100%);
      color: var(--silver-bright);
    }
    .shell {
      max-width: 980px;
      margin: 0 auto;
      padding: 1.25rem 1.25rem 2.5rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.75rem;
    }
    .eyebrow {
      margin: 0;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.62rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--champagne);
    }
    h1 {
      margin: 0.2rem 0 0;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--silver);
    }
    .stage-pill {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.58rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid var(--line-soft);
      border-radius: 999px;
      padding: 0.4rem 0.75rem;
      white-space: nowrap;
    }
    .lede {
      margin: 0 0 1.25rem;
      color: var(--muted);
      font-size: 0.9rem;
      max-width: 52ch;
      line-height: 1.45;
    }
    .back {
      appearance: none;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.45rem 0.8rem;
      border-radius: 999px;
      cursor: pointer;
      margin-bottom: 1rem;
    }
    .back:hover { color: var(--silver-bright); border-color: var(--silver); }
    .back[hidden] { display: none; }

    .stage { display: none; flex: 1; animation: in 480ms ease both; }
    .stage.on { display: flex; flex-direction: column; }
    @keyframes in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes dissolve {
      to { opacity: 0; filter: blur(6px); transform: scale(0.92); }
    }
    .dissolving { animation: dissolve 520ms ease forwards; pointer-events: none; }

    /* Landing folders */
    .folders {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2.5rem;
      align-items: center;
      justify-items: center;
      padding: 2rem 0 1rem;
    }
    @media (max-width: 720px) {
      .folders { grid-template-columns: 1fr; gap: 2rem; }
    }
    .folder-wrap {
      text-align: center;
      cursor: pointer;
      background: none;
      border: none;
      color: inherit;
      font: inherit;
      padding: 1rem;
    }
    .folder-wrap:focus-visible { outline: 2px solid var(--silver); outline-offset: 4px; border-radius: 12px; }
    .folder-wrap.quiet { opacity: 0.55; }
    .folder-wrap.quiet:hover { opacity: 0.8; }
    .folder {
      width: 160px;
      height: 120px;
      margin: 0 auto 1rem;
      position: relative;
      transform-origin: center bottom;
      transition: transform 500ms ease;
    }
    .folder-wrap:hover .folder { transform: translateY(-6px); }
    .folder-back {
      position: absolute;
      inset: 0;
      background: #343a44;
      border-radius: 0 14px 14px 14px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.45);
    }
    .folder-tab {
      position: absolute;
      left: 0; bottom: 98%;
      width: 48px; height: 14px;
      background: #343a44;
      border-radius: 6px 6px 0 0;
    }
    .folder-front {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #3a404a, var(--gunmetal));
      border: 1px solid var(--line);
      border-radius: 6px 14px 14px 14px;
      transform-origin: bottom center;
      transition: transform 520ms cubic-bezier(0.83, 0, 0.17, 1);
    }
    .folder-wrap:hover .folder-front {
      transform: skewX(8deg) scaleY(0.72);
    }
    .folder-label {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--silver-bright);
      letter-spacing: 0.02em;
    }
    .folder-sub {
      margin-top: 0.35rem;
      font-size: 0.78rem;
      color: var(--muted);
      max-width: 22ch;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.35;
    }

    /* Area cards */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 0.9rem;
    }
    .area-card {
      text-align: left;
      cursor: pointer;
      border-radius: 14px;
      border: 1px solid var(--line-soft);
      background: linear-gradient(180deg, #2a2e35, #1c2026);
      padding: 1.1rem 1.15rem;
      color: inherit;
      font: inherit;
      transition: transform 280ms ease, border-color 280ms ease, box-shadow 280ms ease;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
    }
    .area-card:hover {
      transform: translateY(-3px);
      border-color: var(--silver);
      box-shadow: 0 12px 28px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.06);
    }
    .area-card h3 {
      margin: 0 0 0.45rem;
      font-size: 1rem;
      font-weight: 600;
      color: var(--silver-bright);
    }
    .area-card p {
      margin: 0;
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.4;
    }

    /* Vehicles / glass tiles */
    .tile-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 2.2rem 1.6rem;
      padding: 1.5rem 0.5rem 2rem;
      justify-items: center;
    }
    .vehicle {
      background: none;
      border: none;
      color: inherit;
      font: inherit;
      cursor: pointer;
      width: 5.2em;
      perspective: 24em;
      transform-style: preserve-3d;
      padding: 0;
      position: relative;
    }
    .vehicle:focus-visible { outline: none; }
    .vehicle:focus-visible .glass {
      box-shadow: 0 0 0 2px var(--near-black), 0 0 0 4px var(--silver);
    }
    .vehicle-face {
      position: relative;
      width: 5.2em;
      height: 5.2em;
      display: block;
    }
    .vehicle-edge {
      position: absolute;
      inset: 0;
      border-radius: 1.15em;
      background: linear-gradient(145deg, #4a5160, #2a2e35);
      transform: rotate(12deg);
      transform-origin: 100% 100%;
      transition: transform 320ms cubic-bezier(0.83, 0, 0.17, 1);
      box-shadow: 0.35em -0.35em 0.7em rgba(0,0,0,0.35);
    }
    .glass {
      position: absolute;
      inset: 0;
      border-radius: 1.15em;
      background: hsla(0, 0%, 100%, 0.1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: inset 0 0 0 1px rgba(207,213,222,0.35);
      display: grid;
      place-items: center;
      transition: transform 320ms cubic-bezier(0.83, 0, 0.17, 1);
    }
    .vehicle:hover .vehicle-edge {
      transform: rotate(22deg) translate3d(-0.35em, -0.35em, 0.35em);
    }
    .vehicle:hover .glass {
      transform: translate3d(0, 0, 1.2em);
    }
    .vehicle svg {
      width: 1.55em;
      height: 1.55em;
      stroke: var(--silver);
      fill: none;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .vehicle-label {
      display: block;
      margin-top: 0.85rem;
      text-align: center;
      font-size: 0.72rem;
      line-height: 1.3;
      color: var(--muted);
      max-width: 11em;
      opacity: 0.85;
      transition: opacity 280ms ease, color 280ms ease;
    }
    .vehicle:hover .vehicle-label {
      opacity: 1;
      color: var(--silver-bright);
    }

    /* Stairway */
    .stair-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1rem 0 2rem;
    }
    .stair-field {
      width: min(420px, 100%);
      aspect-ratio: 4 / 5;
      border-radius: 18px;
      border: 1px solid var(--line-soft);
      background:
        radial-gradient(80% 50% at 50% 15%, rgba(207,213,222,0.08), transparent 55%),
        #050608;
      position: relative;
      overflow: hidden;
      margin-bottom: 1.25rem;
      box-shadow: 0 24px 60px rgba(0,0,0,0.5);
    }
    .stair {
      position: absolute;
      left: 18%;
      right: 18%;
      bottom: 12%;
      height: 72%;
      display: flex;
      flex-direction: column-reverse;
      gap: 0.45rem;
    }
    .landing {
      flex: 1;
      border: 1px solid rgba(207,213,222,0.22);
      background: linear-gradient(90deg, transparent, rgba(207,213,222,0.08), transparent);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 0.75rem;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.58rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0;
      transform: translateY(8px);
      animation: land 600ms ease forwards;
    }
    .landing:nth-child(1) { animation-delay: 120ms; }
    .landing:nth-child(2) { animation-delay: 220ms; }
    .landing:nth-child(3) { animation-delay: 320ms; }
    .landing:nth-child(4) { animation-delay: 420ms; }
    .landing span:last-child { color: var(--silver); }
    @keyframes land {
      to { opacity: 1; transform: none; }
    }
    .stair-glow {
      position: absolute;
      left: 30%;
      right: 30%;
      top: 8%;
      height: 40px;
      background: radial-gradient(ellipse at center, rgba(196,165,116,0.35), transparent 70%);
      filter: blur(8px);
    }
    .stair-title {
      margin: 0 0 0.4rem;
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--silver-bright);
    }
    .stair-sub {
      margin: 0 0 1.25rem;
      color: var(--muted);
      font-size: 0.85rem;
      max-width: 36ch;
    }
    .begin {
      appearance: none;
      border: 1.5px solid var(--silver);
      background: var(--gunmetal);
      color: var(--silver-bright);
      font: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.75rem 1.4rem;
      border-radius: 999px;
      cursor: pointer;
    }
    .begin:hover { background: #343a44; border-color: var(--silver-bright); }

    /* Stepper mock */
    .stepper {
      width: min(440px, 100%);
      margin: 0 auto;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #2a2e35, #1c2026);
      box-shadow: 0 20px 50px rgba(0,0,0,0.45);
      overflow: hidden;
    }
    .step-dots {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      padding: 1.25rem 1.25rem 0.5rem;
    }
    .dot {
      width: 1.7rem;
      height: 1.7rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      font-size: 0.7rem;
      color: var(--muted);
      background: #14171c;
      flex-shrink: 0;
    }
    .dot.on {
      border-color: var(--silver);
      color: var(--near-black);
      background: var(--silver);
    }
    .dot.done {
      border-color: var(--champagne);
      color: var(--champagne);
    }
    .conn {
      flex: 1;
      height: 2px;
      background: rgba(207,213,222,0.15);
      border-radius: 2px;
    }
    .conn.done { background: rgba(196,165,116,0.55); }
    .step-body { padding: 1rem 1.35rem 0.5rem; min-height: 140px; }
    .step-body h3 { margin: 0 0 0.5rem; font-size: 1.05rem; }
    .step-body p { margin: 0; color: var(--muted); font-size: 0.88rem; line-height: 1.45; }
    .bump {
      margin-top: 0.85rem;
      padding: 0.65rem 0.75rem;
      border-radius: 10px;
      border: 1px solid rgba(196,165,116,0.35);
      background: rgba(196,165,116,0.08);
      color: var(--champagne);
      font-size: 0.78rem;
      line-height: 1.35;
    }
    .step-foot {
      display: flex;
      justify-content: space-between;
      padding: 1rem 1.35rem 1.25rem;
      gap: 0.75rem;
    }
    .step-foot button {
      appearance: none;
      border-radius: 999px;
      font: inherit;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.55rem 1rem;
      cursor: pointer;
    }
    .ghost {
      border: 1px solid var(--line-soft);
      background: transparent;
      color: var(--muted);
    }
    .next {
      border: 1.5px solid var(--silver);
      background: var(--gunmetal);
      color: var(--silver-bright);
      margin-left: auto;
    }

    .note {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="top">
      <div>
        <p class="eyebrow">Private Confidant</p>
        <h1>Growth</h1>
      </div>
      <div class="stage-pill" id="stage-pill">Stage 0 · Landing</div>
    </div>
    <p class="lede" id="lede">Two folders. Low sensory. Curiosity first — then the climb.</p>
    <button type="button" class="back" id="back" hidden>← Back</button>

    <!-- 0 Landing -->
    <section class="stage on" id="s0" data-stage="0">
      <div class="folders">
        <button type="button" class="folder-wrap" id="open-upgrades" aria-label="Open Status Upgrades">
          <div class="folder" aria-hidden="true">
            <div class="folder-back"><span class="folder-tab"></span></div>
            <div class="folder-front"></div>
          </div>
          <div class="folder-label">Status Upgrades</div>
          <div class="folder-sub">Vehicles to destinations — net positive when executed</div>
        </button>
        <button type="button" class="folder-wrap quiet" id="open-stair-tease" aria-label="Stairway tease">
          <div class="folder" aria-hidden="true">
            <div class="folder-back"><span class="folder-tab"></span></div>
            <div class="folder-front"></div>
          </div>
          <div class="folder-label">Stairway</div>
          <div class="folder-sub">Opens after you choose a vehicle</div>
        </button>
      </div>
    </section>

    <!-- 1 Area cards -->
    <section class="stage" id="s1" data-stage="1">
      <div class="card-grid" id="card-grid"></div>
    </section>

    <!-- 2 Vehicles -->
    <section class="stage" id="s2" data-stage="2">
      <div class="tile-grid" id="tile-grid"></div>
    </section>

    <!-- 3 Stairway -->
    <section class="stage" id="s3" data-stage="3">
      <div class="stair-stage">
        <div class="stair-field" aria-hidden="true">
          <div class="stair-glow"></div>
          <div class="stair" id="stair-landings"></div>
        </div>
        <h2 class="stair-title" id="stair-goal">Your climb</h2>
        <p class="stair-sub">The path is visible — the quest has already started. Tasteful ascent, our metal, not costume.</p>
        <button type="button" class="begin" id="begin-climb">Begin the climb</button>
      </div>
    </section>

    <!-- 4 Stepper -->
    <section class="stage" id="s4" data-stage="4">
      <div class="stepper">
        <div class="step-dots" id="step-dots"></div>
        <div class="step-body" id="step-body"></div>
        <div class="step-foot">
          <button type="button" class="ghost" id="step-back">Previous</button>
          <button type="button" class="next" id="step-next">Next</button>
        </div>
      </div>
    </section>

    <p class="note">Design mock only — click through. Not wired to the app yet.</p>
  </div>

  <script>
    const AREAS = [
      { id: 'contract_navigation', title: 'Contract Navigation', outcome: 'Read a contract in sequence and preserve records for a measured response.' },
      { id: 'irs_form_intimacy', title: 'IRS Form Intimacy', outcome: 'Know which forms exist in sensitive ranges and where official PDFs live.' },
      { id: 'proper_debt_discharge', title: 'Debt Resolution Basics', outcome: 'Review ordinary debt-resolution paths and document creditor communications.' },
      { id: 'property_tax_procedure', title: 'Property Tax Procedure', outcome: 'Assessment protest, payment-under-protest, redemption — ordinary walks.' },
      { id: 'securities_control', title: 'Securities & Instruments', outcome: 'Classify an instrument and understand documented terms before relying on it.' },
      { id: 'transition_essentials', title: 'Transition Essentials', outcome: 'Organize identity, records, and signature practices before the next admin move.' },
    ];

    const VEHICLES = {
      contract_navigation: [
        { id: 'auto-dealer', label: 'Auto dealership negotiation', icon: 'file' },
        { id: 'service-msa', label: 'Service / MSA review', icon: 'book' },
        { id: 'lease-read', label: 'Lease walkthrough', icon: 'home' },
        { id: 'generic', label: 'General contract sequence', icon: 'list' },
      ],
      default: [
        { id: 'primary', label: 'Primary path for this area', icon: 'star' },
        { id: 'alt', label: 'Alternate scenario', icon: 'compass' },
        { id: 'records', label: 'Records-first variant', icon: 'archive' },
      ],
    };

    const STEPS = [
      { title: 'Identify the parties and roles', body: 'List named parties, signatories, notices contacts, and entities acting through representatives.', bump: 'A trade name, parent company, and signing individual may not be the same legal party.' },
      { title: 'Map obligations and consideration', body: 'Mark each party’s promised performance, payment or other consideration, conditions, and deadlines.', bump: 'Reading only a summary can omit terms incorporated by reference.' },
      { title: 'Preserve the record', body: 'Capture the pages and clauses that matter before you respond — clarity, not advice.', bump: null },
      { title: 'Arrival', body: 'You have a clean sequence and a preserved trail. Next actions stay yours.', bump: null },
    ];

    const state = {
      stage: 0,
      area: null,
      vehicle: null,
      step: 0,
    };

    const icons = {
      file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/>',
      book: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
      home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
      list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
      star: '<path d="M12 2l2.4 7.2H22l-6 4.8 2.3 7L12 16.8 5.7 21l2.3-7-6-4.8h7.6z"/>',
      compass: '<circle cx="12" cy="12" r="10"/><path d="M16 8l-2.5 6.5L7 17l2.5-6.5L16 8z"/>',
      archive: '<path d="M21 8v13H3V8M1 3h22v5H1zM10 12h4"/>',
    };

    const $ = (id) => document.getElementById(id);
    const stages = [0, 1, 2, 3, 4].map((n) => $('s' + n));
    const pills = [
      'Stage 0 · Landing',
      'Stage 1 · Area cards',
      'Stage 2 · Vehicles',
      'Stage 3 · Stairway',
      'Stage 4 · Climb',
    ];
    const ledes = [
      'Two folders. Low sensory. Curiosity first — then the climb.',
      'Umbrella areas — departments. Pick a shelf.',
      'Vehicles: specific goals inside this discipline. Browse. Nothing started yet.',
      'Soft-hybrid ascent. The path is visible — the quest has already started.',
      'Counted steps. Next / Previous. Almost impossible to miss a beat.',
    ];

    function go(stage) {
      state.stage = stage;
      stages.forEach((el, i) => el.classList.toggle('on', i === stage));
      $('stage-pill').textContent = pills[stage];
      $('lede').textContent = ledes[stage];
      $('back').hidden = stage === 0;
    }

    function renderCards() {
      const grid = $('card-grid');
      grid.innerHTML = '';
      AREAS.forEach((area) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'area-card';
        btn.innerHTML = `<h3>${area.title}</h3><p>${area.outcome}</p>`;
        btn.addEventListener('click', () => {
          [...grid.children].forEach((c) => {
            if (c !== btn) c.classList.add('dissolving');
          });
          state.area = area;
          setTimeout(() => {
            renderVehicles();
            go(2);
          }, 480);
        });
        grid.appendChild(btn);
      });
    }

    function renderVehicles() {
      const grid = $('tile-grid');
      grid.innerHTML = '';
      const list = VEHICLES[state.area?.id] || VEHICLES.default.map((v, i) => ({
        ...v,
        label: i === 0 ? (state.area?.title + ' — primary') : v.label,
      }));
      list.forEach((v) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'vehicle';
        btn.innerHTML = `
          <span class="vehicle-face">
            <span class="vehicle-edge"></span>
            <span class="glass"><svg viewBox="0 0 24 24">${icons[v.icon] || icons.star}</svg></span>
          </span>
          <span class="vehicle-label">${v.label}</span>`;
        btn.addEventListener('click', () => {
          [...grid.children].forEach((c) => {
            if (c !== btn) c.classList.add('dissolving');
          });
          state.vehicle = v;
          setTimeout(() => {
            renderStair();
            go(3);
          }, 480);
        });
        grid.appendChild(btn);
      });
    }

    function renderStair() {
      $('stair-goal').textContent = state.vehicle?.label || 'Your climb';
      const stair = $('stair-landings');
      stair.innerHTML = STEPS.map((s, i) =>
        `<div class="landing"><span>0${i + 1}</span><span>${s.title.split(' ').slice(0, 3).join(' ')}</span></div>`
      ).join('');
    }

    function renderStepper() {
      const dots = $('step-dots');
      dots.innerHTML = '';
      STEPS.forEach((_, i) => {
        if (i > 0) {
          const c = document.createElement('div');
          c.className = 'conn' + (state.step > i - 1 ? ' done' : '');
          dots.appendChild(c);
        }
        const d = document.createElement('div');
        d.className = 'dot' + (state.step === i ? ' on' : state.step > i ? ' done' : '');
        d.textContent = state.step > i ? '✓' : String(i + 1);
        dots.appendChild(d);
      });
      const s = STEPS[state.step];
      $('step-body').innerHTML = `
        <h3>${s.title}</h3>
        <p>${s.body}</p>
        ${s.bump ? `<div class="bump">${s.bump}</div>` : ''}`;
      $('step-next').textContent = state.step >= STEPS.length - 1 ? 'Arrival' : 'Next';
      $('step-back').style.visibility = state.step === 0 ? 'hidden' : 'visible';
    }

    $('open-upgrades').addEventListener('click', () => {
      renderCards();
      go(1);
    });
    $('open-stair-tease').addEventListener('click', () => {
      $('lede').textContent = 'Choose a Status Upgrade vehicle first — then Stairway opens for that climb.';
    });
    $('back').addEventListener('click', () => {
      if (state.stage === 4) { go(3); return; }
      if (state.stage === 3) { renderVehicles(); go(2); return; }
      if (state.stage === 2) { renderCards(); go(1); return; }
      if (state.stage === 1) go(0);
    });
    $('begin-climb').addEventListener('click', () => {
      state.step = 0;
      renderStepper();
      go(4);
    });
    $('step-back').addEventListener('click', () => {
      if (state.step > 0) {
        state.step -= 1;
        renderStepper();
      }
    });
    $('step-next').addEventListener('click', () => {
      if (state.step < STEPS.length - 1) {
        state.step += 1;
        renderStepper();
      } else {
        $('lede').textContent = 'Arrival — mock complete. This is the feel we’re aiming for.';
      }
    });
  </script>
</body>
</html>
